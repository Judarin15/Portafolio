# Configuración de Decap CMS — panel en /admin/
# Guía de activación: cms-oauth/README.md

backend:
  name: github
  repo: Judarin15/Portafolio
  branch: main
  # URL del Worker de Cloudflare que hace el inicio de sesión con GitHub (ver cms-oauth/README.md)
  base_url: https://portafolio-cms-oauth.TU-SUBDOMINIO.workers.dev
  auth_endpoint: auth
  commit_messages:
    create: "Crear {{collection}} «{{slug}}»"
    update: "Actualizar {{collection}} «{{slug}}»"
    delete: "Eliminar {{collection}} «{{slug}}»"
    uploadMedia: "Subir «{{path}}»"
    deleteMedia: "Eliminar «{{path}}»"

# Permite editar en tu computador sin iniciar sesión: ejecuta `npx decap-server` junto a `pnpm dev`
local_backend: true

locale: es

media_folder: "public/assets/uploads"
public_folder: "/assets/uploads"

collections:
- name: posts
  label: Publicaciones
  label_singular: Publicación
  folder: src/content/posts
  create: true
  slug: '{{slug}}'
  summary: '{{title}} — {{published}}'
  sortable_fields:
  - published
  - title
  fields:
  - label: Título
    name: title
    widget: string
  - label: Fecha de publicación
    name: published
    widget: datetime
    format: YYYY-MM-DD
    date_format: YYYY-MM-DD
    time_format: false
  - label: Fecha de actualización
    name: updated
    widget: datetime
    format: YYYY-MM-DD
    date_format: YYYY-MM-DD
    time_format: false
    required: false
  - label: Descripción corta
    name: description
    widget: text
    required: false
  - label: Imagen de portada
    name: cover
    widget: image
    required: false
  - label: Etiquetas
    name: tags
    widget: list
    default: []
    required: false
  - label: Categoría
    name: category
    widget: string
    default: Proyectos
    required: false
  - label: Fijar arriba
    name: pinned
    widget: boolean
    default: false
    required: false
  - label: Borrador (no se publica)
    name: draft
    widget: boolean
    default: false
  - label: Contenido
    name: body
    widget: markdown
